<footer class="md-footer nestor-footer">
  <div class="nestor-footer__inner md-grid">
    <a class="nestor-footer__logo" href="{{ nav.homepage.url | url }}" aria-label="NESTOR guidelines home">
      <img src="{{ config.theme.logo | url }}" alt="NESTOR" width="360" height="165" loading="lazy">
    </a>
    <div class="nestor-footer__description">
      <p class="nestor-footer__number">Deliverable {{ config.extra.deliverable.number }}</p>
      <p class="nestor-footer__title">{{ config.extra.deliverable.title }}</p>
    </div>
  </div>
</footer>
