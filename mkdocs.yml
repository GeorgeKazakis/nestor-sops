site_name: NESTOR Clinical Validation Guidelines
site_url: https://georgekazakis.github.io/nestor-sops/
site_description: Open-access guidelines, protocols and SOPs for validating and translating data-driven innovations into clinical practice within NESTOR.

theme:
  name: material
  custom_dir: overrides
  logo: assets/nestor-logo.png
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  deliverable:
    number: D3.3
    title: Protocols and standard operating procedures on practical recommendations covering the data driven innovative method validation into the clinical practice

markdown_extensions:
  - admonition

# Earlier detailed drafts remain in source, outside the site and search index.
exclude_docs: |
  /introduction.md
  /validation-framework/
  /protocols/
  /templates/

nav:
  - About the guidelines: index.md
  - From research to clinical use: clinical-translation.md
  - Practical workflow: practical-workflow.md
  - Legal, regulatory and ethical guidance: regulatory-guidance.md
  - Harmonisation across sites: harmonisation.md
  - Validation checklist: validation-checklist.md
  - Embryo image-analysis example: embryo-image-analysis.md
  - Limitations and next steps: limitations.md
  - Resources:
      - References and downloads: references.md
      - Abbreviations: abbreviations.md
